name: build

# ⛔ 本工作流只做「编译 + 测试」。它**不允许**包含任何发布动作：
#    v1.0.1 的资产由 tools/release.py 在本地产出并 `gh release upload --clobber` 覆盖，
#    历史上一个 tag 触发的 CI 曾在推 tag 时把线上资产覆盖成 CI 自己编的版本，
#    所以这里既不监听 tag，也绝不出现 dotnet publish / gh release / upload-artifact 之类步骤。
#    要放宽这条之前先读 docs/ARCHITECTURE.md「发布链路」。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # WinUI 3 / WindowsAppSDK 需要 Windows runner。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # 构建期会执行 `git rev-parse --short HEAD` 写入程序集版本（Directory.Build.props），
          # 完整历史还能让"这份二进制来自哪次提交"可核对。
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # -warnaserror：本仓库的门禁就是 0 警告 0 错误，把测试项目的分析器警告也算进去。
      - name: Build
        run: dotnet build ExplorerTabUtility.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test ExplorerTabUtility.Tests/ExplorerTabUtility.Tests.csproj -c Release --no-build

      # 可见性：让"构建戳带提交号 + 九语言卫星资源齐全"这两条不变量在 CI 日志里直接可见，
      # 而不是等到用户界面出现原始 key 才发现。
      #
      # ⛔ 上一版这个步骤在 CI 上一直失败（连续 5 次），原因是**正则漏了 Attribute**：
      #    生成代码里是 `AssemblyInformationalVersionAttribute("1.0.1+<sha>")`，
      #    写成 `AssemblyInformationalVersion\(...` 永远匹配不到 → `Select-String` 无匹配 →
      #    `.Matches[0]` 抛 "Cannot index into a null array"。而本地我是用 grep 的另一个模式验证的，
      #    所以没暴露。教训：**CI 专用步骤必须自己也能给出可读的失败原因**，不要依赖管道里的下标。
      - name: Verify satellite resources and build stamp
        shell: pwsh
        run: |
          $assemblyInfo = Get-ChildItem -Path 'ExplorerTabUtility.App.WinUI/obj/Release' -Recurse `
            -Filter 'ExplorerTabUtility.App.WinUI.AssemblyInfo.cs' | Select-Object -First 1
          if (-not $assemblyInfo) {
            throw "AssemblyInfo.cs not found under obj/Release - did the Build step run?"
          }

          $match = Select-String -Path $assemblyInfo.FullName `
            -Pattern 'AssemblyInformationalVersionAttribute\("([^"]+)"\)'
          if (-not $match) {
            throw "no AssemblyInformationalVersionAttribute found in $($assemblyInfo.FullName)"
          }

          $stamp = $match.Matches[0].Groups[1].Value
          Write-Host "build stamp: $stamp"
          if ($stamp -notmatch '\+[0-9a-f]{7,40}$') {
            throw "build stamp '$stamp' carries no source revision - the SetSourceRevisionIdFromGit target did not run"
          }

          $languages = 'zh-CN','zh-Hant','ja','ko','de','fr','es','ru'
          $missing = $languages | Where-Object {
            -not (Test-Path "ExplorerTabUtility.Core/bin/Release/net10.0-windows/$_/ExplorerTabUtility.Core.resources.dll")
          }
          if ($missing) { throw "missing satellite resources: $($missing -join ', ')" }

          Write-Host "satellite resources: OK ($($languages.Count) languages)"
